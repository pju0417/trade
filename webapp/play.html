<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무역 게임 · 혼자 해 보기</title>
<link rel="stylesheet" href="trade.css">
<link rel="stylesheet" href="atlas.css">
<meta name="theme-color" content="#132e3d">
<style>
  /* Solo play: the engine runs in this page, the student screens are iframes below the bar. */
  body.play-page { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  body.play-page > #app:not([hidden]) { overflow-y: auto; }
  .play-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 6px 12px; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; flex: none;
    background: #132e3d; color: #f3ead2; position: sticky; top: 0; z-index: 10; }
  .play-bar b { color: #fff; }
  .play-bar .grow { flex: 1; }
  .play-bar button, .play-tabs button { font: inherit; }
  .play-tabs { display: flex; gap: 6px; }
  @media (max-width: 700px) { .play-bar { font-size: .8rem; } .play-bar small { display: none; } }
  .play-tabs button[aria-pressed="true"] { outline: 2px solid #efd08b; font-weight: 700; }
  .play-frames { flex: 1; display: flex; min-height: 0; }
  .play-frames iframe { flex: 1; border: 0; width: 100%; height: 100%; }
  .play-frames iframe[hidden] { display: none; }
  .play-world { padding: 0 16px 16px; }
  /* 접었을 때: 화면 위 가운데에 작은 손잡이만 */
  .play-handle { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 20; min-height: 0; padding: 1px 12px 3px; font-size: .75rem; border: 0; border-radius: 0 0 8px 8px; background: rgba(19, 46, 61, .9); color: #e9c46a; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); cursor: pointer; }
  .play-handle[hidden] { display: none; }
</style>
</head>
<body class="play-page">
<header id="bar" class="play-bar" hidden></header>
<button id="bar-handle" class="play-handle" data-act="bar" hidden aria-label="진행 막대 펴기">▼ 진행</button>
<main id="app" class="shell">불러오는 중…</main>
<div id="frames" class="play-frames"></div>
<script type="module" src="js/play.js"></script>
</body>
</html>
